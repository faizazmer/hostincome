name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install project dependencies
        run: npm install

      - name: Install Capacitor
        run: |
          npm install --save-dev @capacitor/cli@6 @capacitor/assets@3
          npm install @capacitor/core@6 @capacitor/android@6

      - name: Build web app (Vite -> dist)
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icon & splash (from resources/)
        run: npx capacitor-assets generate --android

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HostIncome-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
